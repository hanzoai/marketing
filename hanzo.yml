# Hanzo CI/CD — marketing web UI. .github/workflows/cicd.yml is triggers and an
# import of hanzoai/ci; everything else is here.

test:
  # Frozen, so the check resolves the tree the Dockerfile does.
  - name: install
    run: |
      set -e
      corepack enable
      pnpm install --frozen-lockfile

  # The image's build line, run first. A vite build that emits nothing still
  # exits 0, hence the file tests.
  - name: build
    run: |
      set -e
      pnpm build
      test -s dist/index.html
      test -d dist/assets

images:
  - name: marketing
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/marketing
    # No platforms line: ghcr.io/hanzoai/spa is multi-arch, so both build.
    # No build secrets: the bearer is minted by hanzo.id at sign-in.

# marketing.hanzo.ai is bytes: the export is the whole product and its API is
# api.hanzo.ai. The site lane publishes the `build` gate's dist to
# s3://hanzo-sites/hanzo/marketing, where the edge serves it with no pod. The image
# lane above goes when the marketing Deployment does.
site:
  slug: marketing
  dir: dist
  on: [main]
