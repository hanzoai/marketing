[project]
name = "hanzo-marketing"
version = "0.1.0"
description = "AI-powered marketing automation with genetic algorithm optimization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hanzo AI", email = "dev@hanzo.ai" }]
keywords = ["marketing", "automation", "ai", "ml", "genetic-algorithm", "ads"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "clickhouse-connect>=0.7.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",

    # ML/AI
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "deap>=1.4.0",  # Genetic algorithms
    "prophet>=1.1.0",  # Time series forecasting
    "openai>=1.10.0",  # LLM via router

    # Ad Platforms
    "facebook-business>=19.0.0",
    "google-ads>=24.0.0",
    "tiktok-business-api>=0.1.0",

    # Communication
    "sendgrid>=6.11.0",
    "twilio>=8.10.0",
    "slack-sdk>=3.26.0",

    # Social
    "tweepy>=4.14.0",  # Twitter/X
    "linkedin-api>=2.0.0",

    # Utils
    "httpx>=0.26.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "croniter>=2.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
marketing = "marketing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketing"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
