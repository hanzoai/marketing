# Hanzo founder GTM curriculum — machine-readable contract.
#
# Consumed by the /v1/guide engine (built separately). This file is the source
# of truth for the steps a founder org completes. IDs are STABLE and kebab-case:
# the engine stores per-org progress keyed by step id, so a rename orphans
# progress. Add steps; never repurpose an id.
#
# Schema is documented in CHECKLIST.md ("Schema" section). Summary:
#   schema_version : int   — bump on breaking schema change
#   curriculum     : str   — kebab-case curriculum id
#   stages[]       : ordered list; each { id, title, steps[] }
#   steps[]        : ordered list; each:
#     id            : str   — STABLE, kebab-case, unique across whole file
#     title         : str   — short imperative label
#     why           : str   — the reason this step matters
#     how_on_hanzo  : { product, route } — which Hanzo product/route does the job
#                             (route "" when the step is off-product, e.g. a deck)
#     done_criteria : str   — observable, checkable completion condition
#     depends_on    : [str] — step ids that must complete first (may be empty)

schema_version: 1
curriculum: founder-gtm
title: Founder Go-to-Market Curriculum
description: >-
  The ordered set of steps a founder org completes to go from positioning to
  fundraise on Hanzo tooling. Each step names the Hanzo product that does the
  job and a checkable done-criterion.

stages:
  - id: positioning
    title: Positioning
    steps:
      - id: define-icp
        title: Define the ideal customer profile
        why: >-
          Every downstream decision — offer, copy, targeting, channel — collapses
          without a specific who. A vague ICP produces vague ads and no conversions.
        how_on_hanzo:
          product: Analytics
          route: /v1/analytics
        done_criteria: >-
          A written ICP (segment, role, pain, willingness-to-pay) exists and the
          first analytics segment is created to track it.
        depends_on: []

      - id: craft-positioning
        title: Write the one-sentence positioning
        why: >-
          If you cannot say who it is for, what it does, and why it is different
          in one sentence, no landing page or ad will either.
        how_on_hanzo:
          product: Studio
          route: studio.hanzo.ai
        done_criteria: >-
          A single positioning statement is written and approved; it is the source
          for the landing headline and ad hooks.
        depends_on: [define-icp]

      - id: define-offer
        title: Define the core offer
        why: >-
          The offer is the highest-leverage variable in the funnel. It is defined
          before spend so every test measures against a real offer.
        how_on_hanzo:
          product: Studio
          route: studio.hanzo.ai
        done_criteria: >-
          The offer (what, price, risk reversal) is documented and reconciled with
          the real plans and any promo in discounts.md.
        depends_on: [craft-positioning]

  - id: landing
    title: Landing & signup
    steps:
      - id: build-landing
        title: Build the landing page
        why: >-
          The landing page is where traffic converts or leaks. It must exist, with
          one primary CTA, before any traffic is bought.
        how_on_hanzo:
          product: Studio
          route: studio.hanzo.ai
        done_criteria: >-
          A live landing page follows the structure in GUIDE.md (promise, proof,
          offer, single CTA) with only honest, sourced claims.
        depends_on: [define-offer]

      - id: setup-signup
        title: Wire public free signup
        why: >-
          Signup must be public and free so the top of the funnel is frictionless;
          gated surfaces come later via the waitlist.
        how_on_hanzo:
          product: IAM
          route: /iam
        done_criteria: >-
          A visitor can create a free account from the landing page, and the
          account issues a referral code at creation.
        depends_on: [build-landing]

  - id: analytics-foundation
    title: Analytics foundation
    steps:
      - id: install-tracker
        title: Install event capture
        why: >-
          You cannot optimize what you do not capture. One capture layer, no second
          analytics SDK.
        how_on_hanzo:
          product: Tracker
          route: /v1/tracker
        done_criteria: >-
          A test signup produces pageview, signup, and activation events in
          /v1/tracker with stable event names.
        depends_on: [setup-signup]

      - id: define-analytics-goals
        title: Define analytics goals
        why: >-
          Campaigns and tests must be judged on conversions, not clicks. Goals are
          defined before traffic so every experiment has a target.
        how_on_hanzo:
          product: Analytics
          route: /v1/analytics
        done_criteria: >-
          The goals signup, activate, add_payment, purchase, and refer_activated
          exist in /v1/analytics and each fires on a manual test run.
        depends_on: [install-tracker]

      - id: setup-insights
        title: Stand up the testing engine
        why: >-
          Offer, headline, and onboarding wins come from controlled experiments,
          not opinions. Feature flags gate variants; analytics reads the winner.
        how_on_hanzo:
          product: Insights
          route: ""
        done_criteria: >-
          A feature flag with an A/B split is live and its variant conversion is
          readable per-goal in /v1/analytics.
        depends_on: [define-analytics-goals]

  - id: waitlist
    title: Waitlist & points
    steps:
      - id: launch-waitlist
        title: Launch the gated waitlist
        why: >-
          A ranked access queue lets you control activation and load while building
          an engaged list before paid spend.
        how_on_hanzo:
          product: Console
          route: app.hanzo.ai
        done_criteria: >-
          New accounts land on the waitlist with a visible queue position; console,
          chat, and app access are gated behind it.
        depends_on: [setup-signup]

      - id: setup-points-ledger
        title: Enable the points ledger
        why: >-
          Points move accounts up the access queue and reward the actions that grow
          the network — referral, share, follow, node.
        how_on_hanzo:
          product: Tracker
          route: /v1/tracker
        done_criteria: >-
          Referral (10), share (2), social-follow (15), and run-hanzod (25) each
          award points on their verified event, per GTM.md.
        depends_on: [launch-waitlist, install-tracker]

      - id: run-access-waves
        title: Run controlled access waves
        why: >-
          Unlocking the queue in batches keeps activation and infrastructure load
          observable instead of a single uncontrolled flood.
        how_on_hanzo:
          product: Analytics
          route: /v1/analytics
        done_criteria: >-
          At least one access wave is granted by position+points, and activation of
          the unlocked cohort is measured in /v1/analytics.
        depends_on: [setup-points-ledger]

  - id: email
    title: Email
    steps:
      - id: wire-transactional-email
        title: Wire lifecycle email
        why: >-
          Owned email is the highest-ROI channel and the backbone of onboarding —
          welcome, unlock, activation nudge, promo-ending, win-back.
        how_on_hanzo:
          product: Tracker
          route: /v1/tracker
        done_criteria: >-
          Lifecycle emails are triggered by /v1/tracker events (signup, unlock,
          no-activate) and delivery is confirmed on a test account.
        depends_on: [install-tracker]

      - id: build-nurture-sequence
        title: Build the waitlist nurture sequence
        why: >-
          The waitlist must be warmed between signup and unlock so it converts when
          access is granted.
        how_on_hanzo:
          product: Studio
          route: studio.hanzo.ai
        done_criteria: >-
          A multi-step nurture sequence is live; open and click rates are readable
          in /v1/analytics.
        depends_on: [wire-transactional-email, launch-waitlist]

      - id: test-email-subjects
        title: A/B test subject lines
        why: >-
          Subject lines set open rate, which caps every downstream email metric.
          They are the cheapest test with the widest leverage.
        how_on_hanzo:
          product: Insights
          route: ""
        done_criteria: >-
          At least one subject-line A/B test has run to its pre-declared sample and
          a winner is logged in analysis/.
        depends_on: [build-nurture-sequence, setup-insights]

  - id: ads
    title: Paid acquisition
    steps:
      - id: define-campaign-structure
        title: Define the campaign hierarchy
        why: >-
          Clean campaign/ad-set/ad structure keeps budget and learning attributable,
          and keeps cold, warm, and hot spend from hiding in each other.
        how_on_hanzo:
          product: Analytics
          route: /v1/analytics
        done_criteria: >-
          Campaigns map one objective to one analytics goal, with cold, warm, and
          hot audiences separated per GUIDE.md.
        depends_on: [define-analytics-goals]

      - id: launch-first-1000-promo
        title: Launch the First-1000 promo
        why: >-
          A time-boxed, capped offer converts the warm waitlist into paying users
          with bounded, known cost.
        how_on_hanzo:
          product: Console
          route: app.hanzo.ai
        done_criteria: >-
          The 90%-off-first-month promo is live with the abuse guards and hard
          1,000-redemption cap from discounts.md enforced server-side.
        depends_on: [define-campaign-structure, run-access-waves]

      - id: launch-cold-prospecting
        title: Launch cold prospecting
        why: >-
          Once the funnel converts warm traffic profitably, cold campaigns buy
          growth beyond the owned audience.
        how_on_hanzo:
          product: Analytics
          route: /v1/analytics
        done_criteria: >-
          Cold campaigns run on Meta and/or Google with CAC per goal tracked daily
          against a pre-set ceiling in /v1/analytics.
        depends_on: [launch-first-1000-promo]

  - id: retargeting
    title: Retargeting & lookalikes
    steps:
      - id: export-conversion-events
        title: Export conversion events to ad platforms
        why: >-
          Retargeting and lookalikes need real conversion events fed to the ad
          platform so its optimizer learns on truth, not proxy clicks.
        how_on_hanzo:
          product: Tracker
          route: /v1/tracker
        done_criteria: >-
          Verified conversion events export to the Meta/Google custom-audience
          pipelines and reconcile with /v1/analytics counts.
        depends_on: [install-tracker]

      - id: build-retargeting-audiences
        title: Build retargeting audiences
        why: >-
          People who already touched the funnel are the cheapest conversions;
          retargeting is mandatory before scaling cold spend.
        how_on_hanzo:
          product: Tracker
          route: /v1/tracker
        done_criteria: >-
          Audiences for visited-not-signed-up, signed-up-not-activated, and
          activated-not-paid are built from /v1/tracker events.
        depends_on: [export-conversion-events]

      - id: build-lookalikes
        title: Build lookalike audiences
        why: >-
          Lookalikes seeded from paying users find more of who already pays — but
          only if the seed is high-value and current.
        how_on_hanzo:
          product: Analytics
          route: /v1/analytics
        done_criteria: >-
          Lookalikes are seeded only from activated/paying users pulled from
          /v1/analytics, with existing customers suppressed from prospecting.
        depends_on: [build-retargeting-audiences, launch-cold-prospecting]

  - id: referral
    title: Referral & node growth
    steps:
      - id: launch-referral-program
        title: Launch the referral program
        why: >-
          Referrals turn users into a distribution channel and are the leading
          organic engine across all GTM phases.
        how_on_hanzo:
          product: Tracker
          route: /v1/tracker
        done_criteria: >-
          Referral codes attribute referred signups, and the 10-point award fires
          only on the referred account's activation.
        depends_on: [setup-points-ledger]

      - id: amplify-node-running
        title: Promote node-running as the fast lane
        why: >-
          Running hanzod earns the most points (25) and turns users into
          infrastructure — capacity and queue growth in one action.
        how_on_hanzo:
          product: hanzod
          route: ""
        done_criteria: >-
          A one-command hanzod install is documented, and node heartbeats award
          25 points after the minimum uptime window.
        depends_on: [setup-points-ledger]

  - id: content
    title: Content engine
    steps:
      - id: setup-content-calendar
        title: Set up the content calendar
        why: >-
          One shared schedule makes email, social, and offers reinforce each other
          instead of colliding.
        how_on_hanzo:
          product: Studio
          route: studio.hanzo.ai
        done_criteria: >-
          A calendar of sends, posts, and launches for the next 4 weeks exists and
          aligns each promo push with its email and organic support.
        depends_on: [craft-positioning]

      - id: produce-studio-content
        title: Produce channel content in Studio
        why: >-
          A single core message fanned into channel-native cuts is cheaper and more
          consistent than bespoke assets per channel.
        how_on_hanzo:
          product: Studio
          route: studio.hanzo.ai
        done_criteria: >-
          Ad, landing, and email assets for the current campaign are produced in
          Studio and attached to their flagged variants.
        depends_on: [setup-content-calendar]

  - id: fundraise
    title: Fundraise
    steps:
      - id: assemble-metrics-deck
        title: Assemble the metrics deck
        why: >-
          Investors fund traction. A deck built on measured funnel, retention, and
          unit-economics data is the difference between a term sheet and a pass.
        how_on_hanzo:
          product: Analytics
          route: /v1/analytics
        done_criteria: >-
          A deck presents measured signup, activation, retention, CAC, and LTV
          pulled from /v1/analytics — every number sourced, none invented.
        depends_on: [launch-cold-prospecting, build-lookalikes]

      - id: build-data-room
        title: Build the data room
        why: >-
          A clean data room shortens diligence; the numbers must match the deck and
          the analytics exactly.
        how_on_hanzo:
          product: Analytics
          route: /v1/analytics
        done_criteria: >-
          A data room contains cohort, channel, and unit-economics exports that
          reconcile to /v1/analytics with no unexplained deltas.
        depends_on: [assemble-metrics-deck]

      - id: run-raise
        title: Run the raise
        why: >-
          A time-boxed, well-run process with real traction creates the competition
          that closes rounds on good terms.
        how_on_hanzo:
          product: Analytics
          route: /v1/analytics
        done_criteria: >-
          The raise runs on a defined timeline with a live pipeline; metrics shown
          to investors stay in sync with /v1/analytics throughout.
        depends_on: [build-data-room]
